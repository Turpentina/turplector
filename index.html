<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Collection</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="favicon.ico" />
    <button id="sidebarToggle">☰</button>
</head>
<body>
    <div id="layout">
        <!-- Sidebar -->
        <aside id="sidebar">
            <input type="text" id="searchInput" placeholder="Search cards..." />
    
            <h3>Filter by Set</h3>
            <select id="setFilter"><option value="">All Sets</option></select>
    
            <h3>Filter by Rarity</h3>
            <select id="rarityFilter"><option value="">All Rarities</option></select>
    
            <h3>Filter by Category</h3>
            <select id="categoryFilter"><option value="">All Categories</option></select>
    
            <h3>Filter by Subcategory</h3>
            <select id="subcategoryFilter"><option value="">All Subcategories</option></select>
    
            <h3>Collection Status</h3>
            <select id="collectionFilter">
                <option value="">All</option>
                <option value="collected">Collected</option>
                <option value="missing">Missing</option>
            </select>

            <button type="button" id="applyFilters">Apply filters</button>
    
            <button id="toggleAllCollected">Check/Uncheck All</button>
            <button id="exportCollected">Export Collection</button>
            <button id="importCollected">Import Collection</button>
            <input type="file" id="importCollectedFile" accept=".txt" style="display:none;">
        </aside>
    
        <!-- RIGHT SIDE -->
        <div class="right">
            <header>
                <h1>Genshin Physical TCG Tracker</h1>
            </header>
    
            <main class="content">
                <div id="cardCount">Loading...</div>
                <div id="cardGrid" class="card-grid"></div>
            </main>
        </div>
    </div>
    
    <script src="static/paths.js"></script>
    <script src="static/script.js"></script>
</body>
</html>
